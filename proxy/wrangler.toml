name = "screen-select-ai"
main = "worker.js"
compatibility_date = "2026-10-01"

# Each person (by IP address) gets 10 requests a minute.
[[ratelimits]]
name = "PER_PERSON"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Everyone together gets 120 a minute, so a flood can't drain the NVIDIA credits.
[[ratelimits]]
name = "EVERYONE"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
