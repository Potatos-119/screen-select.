<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Screen Select settings</title>
    <style>
      @font-face { font-family: 'Hand'; src: url('fonts/caveat.woff2') format('woff2'); font-weight: 500; }
      :root {
        --page: #eceef2; --sheet: #ffffff; --text: #1d2129; --muted: #5c6470; --line: #e3e6eb;
        --accent: #3563e9; --on-accent: #ffffff; --field: #ffffff; --radius: 14px; --control: 8px;
        --heading: 600 26px/1.2 system-ui, -apple-system, sans-serif; --shadow: 0 16px 40px -18px rgba(0, 0, 0, 0.4);
        --dash: solid; --blur: none;
      }
      :root[data-theme='print'] {
        --page: #2a2e38; --sheet: #f7f8f4; --text: #1c2230; --muted: #4a5163; --line: #4a5163; --accent: #ffe94a;
        --on-accent: #1c2230; --radius: 3px; --control: 2px; --heading: 500 46px/1.1 'Hand', cursive;
        --shadow: 0 26px 52px -12px rgba(0, 0, 0, 0.6); --dash: dashed;
      }
      :root[data-theme='mac'] {
        --page: linear-gradient(150deg, #8fa8cf, #cdd6e6); --sheet: rgba(246, 246, 248, 0.74); --text: #1d1d1f;
        --muted: #6e6e73; --line: rgba(0, 0, 0, 0.1); --accent: #007aff; --field: rgba(255, 255, 255, 0.7);
        --radius: 12px; --control: 6px; --heading: 600 22px/1.2 -apple-system, BlinkMacSystemFont, sans-serif;
        --shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.3), 0 22px 60px rgba(0, 0, 0, 0.35);
        --blur: blur(34px) saturate(180%);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='print']) { --text: #eef0f3; --muted: #a2a9b5; --line: rgba(255, 255, 255, 0.13); --field: rgba(255, 255, 255, 0.07); }
        :root:not([data-theme='mac']):not([data-theme='print']) { --page: #15171b; --sheet: #1f2228; --accent: #6b8ff5; --on-accent: #10131a; }
        :root[data-theme='mac'] { --page: linear-gradient(150deg, #27303f, #3d4656); --sheet: rgba(44, 44, 48, 0.72); --accent: #0a84ff; }
      }
      * { box-sizing: border-box; }
      html { min-height: 100%; background: var(--page); }
      body { margin: 0; padding: 48px 16px; color: var(--text); font: 15px/1.5 system-ui, -apple-system, sans-serif; }
      main {
        max-width: 560px; margin: 0 auto; padding: 22px 28px 26px; background: var(--sheet);
        border-radius: var(--radius); box-shadow: var(--shadow);
        backdrop-filter: var(--blur); -webkit-backdrop-filter: var(--blur);
      }
      h1 { margin: 0 0 14px; font: var(--heading); }
      fieldset { margin: 0; padding: 16px 0; border: 0; border-top: 1px var(--dash) var(--line); }
      legend { float: left; width: 100%; margin-bottom: 8px; padding: 0; font-weight: 600; }
      label { display: block; padding: 3px 0; }
      input[type='radio'] { accent-color: var(--text); }
      input[type='password'] {
        width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: var(--control);
        background: var(--field); color: var(--text); font: inherit;
      }
      button {
        margin-top: 10px; padding: 6px 12px; border: 0; border-radius: var(--control); background: var(--accent);
        color: var(--on-accent); font: 600 14px/1.3 system-ui, -apple-system, sans-serif; cursor: pointer;
      }
      :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
      small { display: block; margin-top: 8px; color: var(--muted); font-size: 13px; }
      #key-status:empty { display: none; }
      .looks { clear: both; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
      .looks label { padding: 8px; border: 1px solid var(--line); border-radius: var(--control); cursor: pointer; }
      .looks label:has(input:checked) { border-color: var(--text); box-shadow: inset 0 0 0 1px var(--text); }
      .look { display: block; height: 62px; margin-bottom: 6px; border-radius: 4px; background: #5c6470; padding: 8px; }
      .card { display: block; height: 100%; padding: 6px; }
      .look-basic .card { border-radius: 5px; background: #fff; }
      .look-basic .card::after { content: ''; display: block; width: 44%; height: 9px; margin-top: 18px; border-radius: 3px; background: #3563e9; }
      .look-print { background: #2a2e38; }
      .look-print .card { background: #f7f8f4; padding: 4px; }
      .look-print .card::before { content: ''; display: block; height: 22px; background: #14161b; }
      .look-print .card::after { content: 'hello'; display: block; color: #1c2230; font: 500 14px/1.1 'Hand', cursive; }
      .look-mac { background: linear-gradient(150deg, #8fa8cf, #cdd6e6); }
      .look-mac .card {
        border-radius: 6px; background: rgba(246, 246, 248, 0.82);
        background-image: radial-gradient(circle at 9px 9px, #ff5f57 3.2px, transparent 3.7px),
          radial-gradient(circle at 19px 9px, #febc2e 3.2px, transparent 3.7px),
          radial-gradient(circle at 29px 9px, #28c840 3.2px, transparent 3.7px);
      }
      @media (max-width: 480px) { .looks { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
    <h1>Screen Select</h1>
    <fieldset>
      <legend>Look</legend>
      <div class="looks">
        <label><span class="look look-basic"><span class="card"></span></span><input type="radio" name="theme" value="basic" /> Basic</label>
        <label><span class="look look-print"><span class="card"></span></span><input type="radio" name="theme" value="print" /> Print</label>
        <label><span class="look look-mac"><span class="card"></span></span><input type="radio" name="theme" value="mac" /> Mac</label>
      </div>
    </fieldset>
    <fieldset>
      <legend>Your Claude API key</legend>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" aria-label="Claude API key" />
      <button id="save-key">Save key</button>
      <small id="key-status" role="status"></small>
      <small>
        Create a key at console.anthropic.com. It is stored only in this browser profile. Your selection is sent to
        Anthropic only when you press Brief.
      </small>
    </fieldset>
    <fieldset>
      <legend>Brief uses</legend>
      <label><input type="radio" name="briefModel" value="opus" /> Claude Opus 5.5 (best answers)</label>
      <label><input type="radio" name="briefModel" value="haiku" /> Claude Haiku 5.5 (much cheaper)</label>
    </fieldset>
    <fieldset>
      <legend>Ask opens</legend>
      <label><input type="radio" name="askTarget" value="claude" /> Claude</label>
      <label><input type="radio" name="askTarget" value="chatgpt" /> ChatGPT</label>
    </fieldset>
    </main>
    <script src="options.js"></script>
  </body>
</html>
