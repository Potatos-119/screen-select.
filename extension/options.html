<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Screen Select settings</title>
    <style>
      @font-face { font-family: 'Hand'; src: url('fonts/caveat.woff2') format('woff2'); font-weight: 500; }
      :root { --paper: #f7f8f4; --ink: #1c2230; --ink-soft: #4a5163; --marker: #ffe94a; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; padding: 48px 16px; background: #2a2e38; color: var(--ink);
        font: 15px/1.5 system-ui, sans-serif;
      }
      main {
        max-width: 520px; margin: 0 auto; padding: 16px 28px 28px; background: var(--paper); border-radius: 3px;
        box-shadow: 0 1px 1px rgba(20, 24, 34, 0.3), 0 26px 52px -12px rgba(0, 0, 0, 0.6);
      }
      h1 { margin: 0 0 12px; font: 500 46px/1.1 'Hand', cursive; transform: rotate(-1deg); transform-origin: left; }
      fieldset { margin: 0; padding: 16px 0; border: 0; border-top: 1px dashed var(--ink-soft); }
      legend { float: left; width: 100%; margin-bottom: 8px; padding: 0; font-weight: 600; }
      label { display: block; padding: 3px 0; }
      input[type='radio'] { accent-color: var(--ink); }
      input[type='password'] {
        width: 100%; padding: 8px 10px; border: 1.5px solid var(--ink); border-radius: 2px;
        background: #fff; color: var(--ink); font: inherit;
      }
      button {
        margin-top: 10px; padding: 6px 12px; border: 0; border-radius: 2px; background: var(--marker);
        color: var(--ink); font: 600 14px/1.3 system-ui, sans-serif; cursor: pointer;
      }
      :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
      small { display: block; margin-top: 8px; color: var(--ink-soft); font-size: 13px; }
      #key-status:empty { display: none; }
    </style>
  </head>
  <body>
    <main>
    <h1>Screen Select</h1>
    <fieldset>
      <legend>Your Claude API key</legend>
      <input id="api-key" type="password" autocomplete="off" spellcheck="false" aria-label="Claude API key" />
      <button id="save-key">Save key</button>
      <small id="key-status" role="status"></small>
      <small>
        Create a key at console.anthropic.com. It is stored only in this browser profile. Your selection is sent to
        Anthropic only when you press Brief.
      </small>
    </fieldset>
    <fieldset>
      <legend>Brief uses</legend>
      <label><input type="radio" name="briefModel" value="opus" /> Claude Opus 5.5 (best answers)</label>
      <label><input type="radio" name="briefModel" value="haiku" /> Claude Haiku 5.5 (much cheaper)</label>
    </fieldset>
    <fieldset>
      <legend>Ask opens</legend>
      <label><input type="radio" name="askTarget" value="claude" /> Claude</label>
      <label><input type="radio" name="askTarget" value="chatgpt" /> ChatGPT</label>
    </fieldset>
    </main>
    <script src="options.js"></script>
  </body>
</html>
